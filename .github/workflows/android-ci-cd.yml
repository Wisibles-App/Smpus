name: 🤖 Android CI/CD — Smpus

# ─── When does this run? ─────────────────────────────────────────────────────
on:
  push:
    branches: [ main ]       # Every push to main → triggers full CI + deploy
  pull_request:
    branches: [ main ]       # Every PR to main  → triggers tests only (no deploy)

# ─── Jobs ─────────────────────────────────────────────────────────────────────
jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: TEST
  # Runs on EVERY push and pull request.
  # Builds the web app, syncs to Android, runs JS tests + Android unit tests.
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🧪 Run JavaScript tests (React Testing Library)
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏗️ Build React web app
        run: npm run build
        env:
          CI: false

      - name: 🔄 Sync Capacitor to Android
        run: npx cap sync android

      - name: 🔧 Make gradlew executable
        run: chmod +x android/gradlew

      - name: 🧪 Run Android unit tests (JUnit)
        working-directory: android
        run: ./gradlew test --no-daemon

      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android/app/build/reports/tests/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: BUILD & DEPLOY
  # Runs ONLY on push to main, and ONLY if test job passed.
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Build & Deploy to Play Store
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏗️ Build React web app
        run: npm run build
        env:
          CI: false

      - name: 🔄 Sync Capacitor to Android
        run: npx cap sync android

      - name: 🔑 Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 --decode > android/app/smpus-release.jks

      - name: 🔧 Make gradlew executable
        run: chmod +x android/gradlew

      - name: 🔢 Set versionCode from build number
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: 📦 Build signed release AAB
        working-directory: android
        env:
          KEYSTORE_PATH: smpus-release.jks
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: 📤 Save AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: smpus-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: 🚀 Upload to Google Play (Internal Track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.wisibles.smpus
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          releaseName: "v${{ github.run_number }}"
